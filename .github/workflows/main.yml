name: Daily Autonomous Portfolio Rebalance

on:
  schedule:
    # 03:00 UTC corresponds to 08:00 AM PKT
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install supabase requests python-dotenv

      - name: Run Rebalancer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WATI_API_ENDPOINT: ${{ secrets.WATI_API_ENDPOINT }}
          WATI_ACCESS_TOKEN: ${{ secrets.WATI_ACCESS_TOKEN }}
          RECIPIENT_WHATSAPP_NUMBER: ${{ secrets.RECIPIENT_WHATSAPP_NUMBER }}
        run: python rebalancer_agent.py
